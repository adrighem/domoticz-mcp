<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant gradient from Violet to Cyan for the AI theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/> <!-- Violet -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Cyan -->
    </linearGradient>
    
    <!-- Subtle drop shadow for the chat bubble -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Speech Bubble Background -->
  <path d="M 116 76
           h 280 
           c 33.137 0, 60 26.863, 60 60 
           v 180 
           c 0 33.137, -26.863 60, -60 60 
           h -80 
           l -40 70 
           v -70 
           H 116 
           c -33.137 0, -60 -26.863, -60 -60 
           v -180 
           c 0 -33.137, 26.863 -60, 60 -60 
           z" 
        fill="url(#bgGrad)"
        filter="url(#shadow)" />

  <!-- House Outlines -->
  <g stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Roof -->
    <polyline points="130,230 256,130 382,230" />
    <!-- Walls -->
    <polyline points="166,201 166,320 346,320 346,201" />
    <!-- Arch Door -->
    <path d="M 226,320 V 270 a 30,30 0 0 1 60,0 V 320" />
  </g>

  <!-- AI Sparkle (Main Center) -->
  <path d="M 256,155 
           Q 256,185 286,185 
           Q 256,185 256,215 
           Q 256,185 226,185 
           Q 256,185 256,155 Z" 
        fill="#ffffff" />
        
  <!-- AI Sparkle (Top Right Accent) -->
  <path d="M 310,125 
           Q 310,140 325,140 
           Q 310,140 310,155 
           Q 310,140 295,140 
           Q 310,140 310,125 Z" 
        fill="#ffffff" opacity="0.8" />

  <!-- AI Sparkle (Top Left Accent) -->
  <path d="M 180,150 
           Q 180,160 190,160 
           Q 180,160 180,170 
           Q 180,160 170,160 
           Q 180,160 180,150 Z" 
        fill="#ffffff" opacity="0.6" />
</svg>
