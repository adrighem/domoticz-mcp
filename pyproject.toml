[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domoticz-mcp"
version = "1.3.1"
description = "A Model Context Protocol (MCP) server for Domoticz home automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Vincent"}
]
dependencies = [
    "mcp>=1.27,<2",
    "httpx",
    "pydantic>=2,<3",
    "uvicorn",
    "starlette",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/adrighem/domoticz-mcp"
Repository = "https://github.com/adrighem/domoticz-mcp.git"
Issues = "https://github.com/adrighem/domoticz-mcp/issues"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
domoticz-mcp = "domoticz_mcp.server:main"
